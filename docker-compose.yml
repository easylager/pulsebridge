# Full local stack: ingest, two consumers, metrics, alerts, dashboards, traces.
#
# Two worker replicas rather than one, because the interesting behaviour of this
# system only appears with more than one consumer in the group: work splitting,
# and one replica reclaiming what another left pending. A single-worker demo
# cannot show either.

x-worker-env: &worker-env
  PULSEBRIDGE_REDIS_URL: redis://redis:6379/0
  PULSEBRIDGE_STREAM_KEY: pulsebridge.events
  PULSEBRIDGE_DLQ_STREAM_KEY: pulsebridge.events.dlq
  PULSEBRIDGE_GROUP: pulsebridge-workers
  PULSEBRIDGE_CONCURRENCY: "64"
  PULSEBRIDGE_MAX_ATTEMPTS: "5"
  PULSEBRIDGE_PROCESS_TIMEOUT: "5s"
  PULSEBRIDGE_RECLAIM_MIN_IDLE: "30s"
  PULSEBRIDGE_RECLAIM_INTERVAL: "10s"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  OTEL_SERVICE_NAME: pulsebridge-worker

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build:
      context: ./services/gateway
    environment:
      PULSEBRIDGE_REDIS_URL: redis://redis:6379/0
      PULSEBRIDGE_STREAM_KEY: pulsebridge.events
      PULSEBRIDGE_RATE_LIMIT_RPS: "200"
      PULSEBRIDGE_LOG_LEVEL: INFO
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: pulsebridge-gateway
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # Readiness, not liveness: compose should only consider the gateway up once
      # it can actually reach Redis and accept an event.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/readyz').status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 12

  worker-1:
    build:
      context: ./services/worker
    environment:
      <<: *worker-env
      PULSEBRIDGE_CONSUMER: worker-1
    depends_on:
      redis:
        condition: service_healthy

  worker-2:
    build:
      context: ./services/worker
    environment:
      <<: *worker-env
      PULSEBRIDGE_CONSUMER: worker-2
    depends_on:
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - gateway

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # UI
      - "4318:4318"    # OTLP/HTTP
