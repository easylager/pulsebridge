global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: pulsebridge-gateway
    static_configs:
      - targets: ["gateway:8080"]
    metrics_path: /metrics

  # Both worker replicas are scraped so a stalled consumer is visible
  # individually rather than being averaged away by its healthy peer.
  - job_name: pulsebridge-worker
    static_configs:
      - targets: ["worker-1:9100", "worker-2:9100"]
    metrics_path: /metrics
