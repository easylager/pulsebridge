[project]
name = "pulsebridge-gateway"
version = "0.2.0"
description = "Async high-throughput event ingest gateway for PulseBridge"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "redis>=5.2.0",
  "structlog>=24.4.0",
  "prometheus-client>=0.21.0",
  "httpx>=0.27.0",
  "opentelemetry-api>=1.28.0",
  "opentelemetry-sdk>=1.28.0",
  "opentelemetry-exporter-otlp-proto-http>=1.28.0",
  "opentelemetry-instrumentation-fastapi>=0.49b0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "jsonschema>=4.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pulsebridge_gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "integration: exercises a real Redis instance; skipped when none is reachable",
]

[tool.coverage.run]
source = ["pulsebridge_gateway"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "\\.\\.\\.",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
# Depends()/Header() in argument defaults is how FastAPI declares dependencies;
# the rule targets mutable defaults, which these are not.
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["pulsebridge_gateway"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["opentelemetry.*"]
ignore_missing_imports = true
